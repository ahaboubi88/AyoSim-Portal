<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" fill="none">
  <defs>
    <linearGradient id="bgrtos" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c1407"/>
      <stop offset="100%" stop-color="#4a220b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" rx="12" fill="url(#bgrtos)"/>
  <!-- Dual Core Boxes -->
  <g transform="translate(70, 70)">
    <rect width="210" height="110" rx="8" fill="#1C1C1C" stroke="#E65100" stroke-width="2"/>
    <text x="105" y="35" font-family="'JetBrains Mono', monospace" font-size="14" fill="#E65100" font-weight="bold" text-anchor="middle">XTENSA CORE 0</text>
    <rect x="20" y="55" width="170" height="20" rx="4" fill="#3D1D09"/>
    <text x="105" y="69" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F39C12" text-anchor="middle">WiFi / BT Protocol Stack</text>
    <rect x="20" y="80" width="170" height="20" rx="4" fill="#252525"/>
    <text x="105" y="94" font-family="'JetBrains Mono', monospace" font-size="10" fill="#AAA" text-anchor="middle">Task: PRO_CPU (240MHz)</text>
  </g>
  <g transform="translate(320, 70)">
    <rect width="210" height="110" rx="8" fill="#1C1C1C" stroke="#E65100" stroke-width="2"/>
    <text x="105" y="35" font-family="'JetBrains Mono', monospace" font-size="14" fill="#E65100" font-weight="bold" text-anchor="middle">XTENSA CORE 1</text>
    <rect x="20" y="55" width="170" height="20" rx="4" fill="#3D1D09"/>
    <text x="105" y="69" font-family="'JetBrains Mono', monospace" font-size="11" fill="#2ECC71" text-anchor="middle">User Application / FreeRTOS</text>
    <rect x="20" y="80" width="170" height="20" rx="4" fill="#252525"/>
    <text x="105" y="94" font-family="'JetBrains Mono', monospace" font-size="10" fill="#AAA" text-anchor="middle">Task: APP_CPU (240MHz)</text>
  </g>
  <!-- FreeRTOS Scheduler bar -->
  <rect x="70" y="210" width="460" height="65" rx="8" fill="#151726" stroke="#4A5EAB" stroke-width="2"/>
  <text x="90" y="235" font-family="'JetBrains Mono', monospace" font-size="12" fill="#FFF" font-weight="bold">FreeRTOS Priority Preemption Scheduler</text>
  <rect x="90" y="248" width="100" height="18" rx="3" fill="#E65100"/>
  <text x="140" y="261" font-family="'JetBrains Mono', monospace" font-size="9" fill="#FFF" text-anchor="middle">Queue Semaphore</text>
  <rect x="200" y="248" width="120" height="18" rx="3" fill="#2ECC71"/>
  <text x="260" y="261" font-family="'JetBrains Mono', monospace" font-size="9" fill="#FFF" text-anchor="middle">vTaskDelayUntil()</text>
  <rect x="330" y="248" width="100" height="18" rx="3" fill="#3498DB"/>
  <text x="380" y="261" font-family="'JetBrains Mono', monospace" font-size="9" fill="#FFF" text-anchor="middle">xTaskCreatePinned()</text>
</svg>
