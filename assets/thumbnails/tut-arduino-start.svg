<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b1d"/>
      <stop offset="100%" stop-color="#1b4d3e"/>
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="600" height="340" rx="12" fill="url(#bg1)"/>
  <g opacity="0.1" stroke="#2ECC71" stroke-width="1">
    <path d="M0 40 H600 M0 80 H600 M0 120 H600 M0 160 H600 M0 200 H600 M0 240 H600 M0 280 H600 M0 320 H600"/>
    <path d="M40 0 V340 M80 0 V340 M120 0 V340 M160 0 V340 M200 0 V340 M240 0 V340 M280 0 V340 M320 0 V340 M360 0 V340 M400 0 V340 M440 0 V340 M480 0 V340 M520 0 V340 M560 0 V340"/>
  </g>
  <!-- Arduino Uno stylized -->
  <rect x="70" y="70" width="220" height="200" rx="10" fill="#008184" stroke="#00979D" stroke-width="3"/>
  <rect x="50" y="90" width="30" height="40" rx="4" fill="#C0C0C0"/>
  <rect x="50" y="190" width="30" height="45" rx="3" fill="#333333"/>
  <rect x="130" y="130" width="120" height="60" rx="4" fill="#1C1C1C" stroke="#333"/>
  <text x="190" y="165" font-family="'JetBrains Mono', monospace" font-size="13" fill="#E0E0E0" text-anchor="middle" font-weight="bold">ATmega328P</text>
  <circle cx="260" cy="95" r="8" fill="#E74C3C"/>
  <text x="180" y="105" font-family="sans-serif" font-size="16" fill="#FFFFFF" font-weight="bold">ARDUINO UNO</text>
  <!-- Breadboard & LED circuit -->
  <rect x="340" y="80" width="190" height="180" rx="8" fill="#F4F6F7" stroke="#BDC3C7" stroke-width="2"/>
  <circle cx="435" cy="140" r="14" fill="#2ECC71" filter="url(#glow1)"/>
  <circle cx="435" cy="140" r="8" fill="#A9DFBF"/>
  <path d="M290 110 C 310 110, 330 130, 420 135" stroke="#E74C3C" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M290 230 C 320 230, 360 200, 435 160" stroke="#3498DB" stroke-width="4" stroke-linecap="round" fill="none"/>
  <rect x="380" y="210" width="110" height="30" rx="6" fill="#2C3E50"/>
  <text x="435" y="230" font-family="'JetBrains Mono', monospace" font-size="11" fill="#2ECC71" text-anchor="middle">void loop() { blink(); }</text>
</svg>
