<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" fill="none">
  <defs>
    <linearGradient id="bgrpi1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c0812"/>
      <stop offset="100%" stop-color="#541324"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" rx="12" fill="url(#bgrpi1)"/>
  <!-- 40 Pin GPIO Header on left -->
  <rect x="60" y="70" width="80" height="200" rx="6" fill="#1C1C1C" stroke="#C62828" stroke-width="2"/>
  <text x="100" y="60" font-family="'JetBrains Mono', monospace" font-size="11" fill="#C62828" text-anchor="middle" font-weight="bold">40-PIN GPIO</text>
  <!-- Pins -->
  <g fill="#F1C40F">
    <circle cx="80" cy="90" r="4"/><circle cx="120" cy="90" r="4"/>
    <circle cx="80" cy="110" r="4"/><circle cx="120" cy="110" r="4"/>
    <circle cx="80" cy="130" r="4"/><circle cx="120" cy="130" r="4"/>
    <circle cx="80" cy="150" r="4"/><circle cx="120" cy="150" r="4"/>
    <circle cx="80" cy="170" r="4"/><circle cx="120" cy="170" r="4"/>
    <circle cx="80" cy="190" r="4"/><circle cx="120" cy="190" r="4"/>
    <circle cx="80" cy="210" r="4"/><circle cx="120" cy="210" r="4"/>
    <circle cx="80" cy="230" r="4"/><circle cx="120" cy="230" r="4"/>
    <circle cx="80" cy="250" r="4"/><circle cx="120" cy="250" r="4"/>
  </g>
  <!-- Jumper wires to LEDs -->
  <path d="M120 110 C 200 110, 240 100, 320 100" stroke="#E74C3C" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M120 150 C 200 150, 240 170, 320 170" stroke="#F1C40F" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M120 190 C 200 190, 240 240, 320 240" stroke="#2ECC71" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- LEDs on Right -->
  <g transform="translate(360, 100)">
    <circle cx="0" cy="0" r="16" fill="#E74C3C"/>
    <circle cx="0" cy="0" r="8" fill="#FADBD8"/>
    <text x="35" y="5" font-family="'JetBrains Mono', monospace" font-size="12" fill="#E74C3C" font-weight="bold">GPIO 17 (RED)</text>
  </g>
  <g transform="translate(360, 170)">
    <circle cx="0" cy="0" r="16" fill="#F1C40F"/>
    <circle cx="0" cy="0" r="8" fill="#FCF3CF"/>
    <text x="35" y="5" font-family="'JetBrains Mono', monospace" font-size="12" fill="#F1C40F" font-weight="bold">GPIO 27 (YELLOW)</text>
  </g>
  <g transform="translate(360, 240)">
    <circle cx="0" cy="0" r="16" fill="#2ECC71"/>
    <circle cx="0" cy="0" r="8" fill="#D4EFDF"/>
    <text x="35" y="5" font-family="'JetBrains Mono', monospace" font-size="12" fill="#2ECC71" font-weight="bold">GPIO 22 (GREEN)</text>
  </g>
</svg>
