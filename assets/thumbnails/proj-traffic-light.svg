<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" fill="none">
  <defs>
    <linearGradient id="bgpj1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e231b"/>
      <stop offset="100%" stop-color="#184232"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" rx="12" fill="url(#bgpj1)"/>
  <!-- Traffic Light housing -->
  <g transform="translate(180, 50)">
    <rect width="90" height="230" rx="20" fill="#222" stroke="#444" stroke-width="4"/>
    <circle cx="45" cy="50" r="26" fill="#E74C3C"/>
    <circle cx="45" cy="115" r="26" fill="#F1C40F" opacity="0.3"/>
    <circle cx="45" cy="180" r="26" fill="#2ECC71" opacity="0.3"/>
  </g>
  <!-- Pedestrian Signal & Crossing -->
  <g transform="translate(320, 70)">
    <rect width="100" height="150" rx="10" fill="#1C1C1C" stroke="#2ECC71" stroke-width="2"/>
    <!-- Walking person green -->
    <circle cx="50" cy="45" r="10" fill="#2ECC71"/>
    <path d="M50 55 L50 85 M50 65 L35 80 M50 65 L65 75 M50 85 L35 115 M50 85 L65 115" stroke="#2ECC71" stroke-width="5" stroke-linecap="round"/>
    <text x="50" y="135" font-family="'JetBrains Mono', monospace" font-size="11" fill="#2ECC71" text-anchor="middle">WALK (12s)</text>
  </g>
  <rect x="440" y="100" width="100" height="80" rx="6" fill="#1A1D2E" stroke="#4A5EAB"/>
  <text x="490" y="130" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFF" text-anchor="middle">CROSSING</text>
  <text x="490" y="150" font-family="'JetBrains Mono', monospace" font-size="11" fill="#2ECC71" text-anchor="middle">ACTIVE</text>
</svg>
