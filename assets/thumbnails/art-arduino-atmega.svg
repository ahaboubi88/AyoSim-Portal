    <line x1="150" y1="125" x2="180" y2="125"/>
    <line x1="150" y1="155" x2="180" y2="155"/>
    <line x1="150" y1="185" x2="180" y2="185"/>
    <line x1="150" y1="215" x2="180" y2="215"/>
    <line x1="150" y1="245" x2="180" y2="245"/>
