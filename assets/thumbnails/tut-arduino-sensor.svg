<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" fill="none">
  <defs>
    <linearGradient id="bgsen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2a22"/>
      <stop offset="100%" stop-color="#144d3b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" rx="12" fill="url(#bgsen)"/>
  <!-- Sensor: Ultrasonic HC-SR04 -->
  <rect x="70" y="80" width="180" height="90" rx="8" fill="#1A5276" stroke="#2980B9" stroke-width="2"/>
  <circle cx="115" cy="125" r="30" fill="#2C3E50" stroke="#BDC3C7" stroke-width="4"/>
  <circle cx="115" cy="125" r="16" fill="#7F8C8D"/>
  <circle cx="205" cy="125" r="30" fill="#2C3E50" stroke="#BDC3C7" stroke-width="4"/>
  <circle cx="205" cy="125" r="16" fill="#7F8C8D"/>
  <text x="160" y="100" font-family="'JetBrains Mono', monospace" font-size="10" fill="#ECF0F1" text-anchor="middle">HC-SR04 SONAR</text>
  <!-- Sound waves -->
  <path d="M245 110 A30 30 0 0 1 245 140" stroke="#2ECC71" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M260 100 A45 45 0 0 1 260 150" stroke="#2ECC71" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M275 90 A60 60 0 0 1 275 160" stroke="#2ECC71" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4"/>
  <!-- Serial Monitor graph box -->
  <rect x="300" y="60" width="240" height="210" rx="8" fill="#1C2039" stroke="#4A5EAB" stroke-width="2"/>
  <rect x="300" y="60" width="240" height="32" rx="8" fill="#2A2F4A"/>
  <circle cx="320" cy="76" r="5" fill="#E74C3C"/>
  <circle cx="335" cy="76" r="5" fill="#F39C12"/>
  <circle cx="350" cy="76" r="5" fill="#2ECC71"/>
  <text x="430" y="81" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ECF0F1" text-anchor="middle">Serial Plotter (9600 baud)</text>
  <!-- Waveform line in Serial monitor -->
  <polyline points="320,220 350,220 370,140 400,200 420,130 450,160 480,120 510,190" fill="none" stroke="#2ECC71" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Value tags -->
  <rect x="70" y="210" width="180" height="60" rx="6" fill="#1A1D2E" stroke="#2A2F4A"/>
  <text x="90" y="235" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8E92A8">Distance: <tspan fill="#2ECC71" font-weight="bold">24.8 cm</tspan></text>
  <text x="90" y="255" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8E92A8">Temp: <tspan fill="#E65100" font-weight="bold">22.5 °C</tspan></text>
</svg>
