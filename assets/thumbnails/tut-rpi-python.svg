  <!-- Python code lines -->
  <g font-family="'JetBrains Mono', monospace" font-size="13" xml:space="preserve">
    <text x="100" y="125" fill="#E74C3C">import <tspan fill="#3498DB">RPi.GPIO</tspan> as <tspan fill="#FFF">GPIO</tspan></text>
    <text x="100" y="150" fill="#E74C3C">import <tspan fill="#3498DB">time</tspan></text>
    <text x="100" y="185" fill="#95A5A6"># Set board mode &amp; setup pin</text>
    <text x="100" y="210" fill="#FFF">GPIO.<tspan fill="#F1C40F">setmode</tspan>(GPIO.BCM)</text>
    <text x="100" y="235" fill="#FFF">GPIO.<tspan fill="#F1C40F">setup</tspan>(<tspan fill="#E67E22">18</tspan>, GPIO.OUT)</text>
    <text x="100" y="260" fill="#FFF">GPIO.<tspan fill="#F1C40F">output</tspan>(<tspan fill="#E67E22">18</tspan>, GPIO.HIGH) <tspan fill="#2ECC71"># Active</tspan></text>
