    <path d="M45 130 C45 145 65 145 65 130 L65 70 C65 65 45 65 45 70 Z" fill="#E74C3C"/>
    <circle cx="55" cy="130" r="15" fill="#E74C3C"/>
    <text x="125" y="100" font-family="'JetBrains Mono', monospace" font-size="28" fill="#FFF" font-weight="bold">24°C</text>
    <text x="125" y="130" font-family="'JetBrains Mono', monospace" font-size="14" fill="#E65100">TEMP</text>
    <text x="125" y="155" font-family="'JetBrains Mono', monospace" font-size="12" fill="#888">Humidity: 58%</text>
