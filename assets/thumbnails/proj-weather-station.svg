    <text x="90" y="130" font-family="'JetBrains Mono', monospace" font-size="18" fill="#2ECC71" font-weight="bold" text-anchor="middle">ONLINE</text>
    <text x="90" y="155" font-family="'JetBrains Mono', monospace" font-size="11" fill="#888" text-anchor="middle">WiFi Signal: -52 dBm</text>
