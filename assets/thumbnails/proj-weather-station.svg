      <stop offset="0%" stop-color="#2a1406"/>
      <stop offset="100%" stop-color="#47220a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" rx="12" fill="url(#bgpj3)"/>
  <!-- Weather Display -->
  <g transform="translate(100, 70)">
