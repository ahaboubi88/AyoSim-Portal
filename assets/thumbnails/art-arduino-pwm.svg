<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" fill="none">
  <defs>
    <linearGradient id="bgpwm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2119"/>
      <stop offset="100%" stop-color="#143b2f"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" rx="12" fill="url(#bgpwm)"/>
  <!-- Oscilloscope Display Grid -->
  <rect x="70" y="60" width="460" height="220" rx="8" fill="#0D1B14" stroke="#2ECC71" stroke-width="2"/>
  <g opacity="0.15" stroke="#2ECC71" stroke-width="1">
    <line x1="70" y1="115" x2="530" y2="115"/><line x1="70" y1="170" x2="530" y2="170"/><line x1="70" y1="225" x2="530" y2="225"/>
    <line x1="160" y1="60" x2="160" y2="280"/><line x1="250" y1="60" x2="250" y2="280"/><line x1="340" y1="60" x2="340" y2="280"/><line x1="430" y1="60" x2="430" y2="280"/>
  </g>
  <!-- Square Wave 1 (50% Duty Cycle) -->
  <path d="M100 130 H140 V95 H180 V130 H220 V95 H260 V130 H300 V95 H340 V130 H380 V95 H420 V130 H460 V95 H500" stroke="#2ECC71" stroke-width="3" fill="none"/>
  <text x="100" y="85" font-family="'JetBrains Mono', monospace" font-size="11" fill="#2ECC71" font-weight="bold">CH1: 490 Hz PWM (50% Duty Cycle)</text>
  <!-- Square Wave 2 (25% Duty Cycle) -->
  <path d="M100 240 H160 V205 H180 V240 H240 V205 H260 V240 H320 V205 H340 V240 H400 V205 H420 V240 H480 V205 H500" stroke="#F1C40F" stroke-width="3" fill="none"/>
  <text x="100" y="195" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F1C40F" font-weight="bold">CH2: Timer1 Phase Correct (25% Duty)</text>
</svg>
